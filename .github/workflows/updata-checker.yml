name: Update Checker

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt

on:
  workflow_dispatch:
#  schedule:
#    - cron: 0 */18 * * *

jobs:
  check:
    runs-on: ubuntu-latest

    steps:

    - name: Detect Latest Tag & Get Commit Hash
      id: getTag
      run: |
        # 获取远端所有 tags（排除 ^{} 解引用行，并过滤掉 rc/alpha/beta 等预发布标签）
        LATEST_TAG=$(git ls-remote --tags --refs "$REPO_URL" \
          | awk -F'refs/tags/' '{print $2}' \
          | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
          | sed 's/^v//' \
          | sort -V \
          | tail -n 1)

        if [ -z "$LATEST_TAG" ]; then
          echo "未检测到符合条件的 Tag"
          exit 1
        fi

        # 还原原 tag 名（若远端带 v 前缀则补回 v）
        if git ls-remote --tags --refs "$REPO_URL" | grep -q "refs/tags/v${LATEST_TAG}$"; then
          LATEST_TAG="v${LATEST_TAG}"
        fi

        echo "LATEST_TAG=$LATEST_TAG" >> "$GITHUB_ENV"
        echo "latestTag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
        echo "Using tag: $LATEST_TAG"

        git clone --depth 1 --branch "$LATEST_TAG" "$REPO_URL" .
        COMMIT_HASH=$(git rev-parse HEAD)
        echo "commitHash=$COMMIT_HASH" >> "$GITHUB_OUTPUT"
        echo "Commit hash: $COMMIT_HASH"

    - name: Compare Tag State
      id: cacheTag
      uses: actions/cache@v5
      with:
        path: .tagState
        key: tag-${{ steps.getTag.outputs.latestTag }}-${{ steps.getTag.outputs.commitHash }}

    - name: Save New Tag State
      if: steps.cacheTag.outputs.cache-hit != 'true'
      run: |
        {
          echo "tag=${{ steps.getTag.outputs.latestTag }}"
          echo "commit=${{ steps.getTag.outputs.commitHash }}"
        } | tee .tagState
        echo "检测到新 Tag 或首次记录：${{ steps.getTag.outputs.latestTag }}（${{ steps.getTag.outputs.commitHash }}），请按需手动运行 Build OpenWrt。"

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 3
        keep_minimum_runs: 1
