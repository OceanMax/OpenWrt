name: Update Checker

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt

on:
  workflow_dispatch:
#  schedule:
#    - cron: 0 */18 * * *

jobs:
  check:
    runs-on: ubuntu-latest

    steps:

    - name: Detect Latest Branch & Get Commit Hash
      id: getBranch
      run: |
        # 1. 优先获取最新的发布分支（兼容 openwrt-YY.MM 和 YY.MM）
        LATEST_BRANCH=$(git ls-remote --heads "$REPO_URL" \
          | awk -F'refs/heads/' '{print $2}' \
          | grep -E '^(openwrt-)?[0-9]+\.[0-9]+$' \
          | sort -V \
          | tail -n 1)

        # 若没有匹配的发布分支，仅回退到远端现有分支（不回退到 master）
        if [ -z "$LATEST_BRANCH" ]; then
          LATEST_BRANCH=$(git ls-remote --heads "$REPO_URL" \
            | awk -F'refs/heads/' '{print $2}' \
            | tail -n 1)
        fi

        if [ -z "$LATEST_BRANCH" ]; then
          echo "未检测到任何可用分支"
          exit 1
        fi

        echo "LATEST_BRANCH=$LATEST_BRANCH" >> "$GITHUB_ENV"
        echo "latestBranch=$LATEST_BRANCH" >> "$GITHUB_OUTPUT"
        echo "Using branch: $LATEST_BRANCH"

        git clone --depth 1 --branch "$LATEST_BRANCH" "$REPO_URL" .
        COMMIT_HASH=$(git rev-parse HEAD)
        echo "commitHash=$COMMIT_HASH" >> "$GITHUB_OUTPUT"
        echo "Commit hash: $COMMIT_HASH"

    - name: Compare Branch State
      id: cacheBranch
      uses: actions/cache@v5
      with:
        path: .branchState
        key: branch-${{ steps.getBranch.outputs.latestBranch }}-${{ steps.getBranch.outputs.commitHash }}

    - name: Save New Branch State
      if: steps.cacheBranch.outputs.cache-hit != 'true'
      run: |
        {
          echo "branch=${{ steps.getBranch.outputs.latestBranch }}"
          echo "commit=${{ steps.getBranch.outputs.commitHash }}"
        } | tee .branchState
        echo "检测到分支新提交或首次记录：${{ steps.getBranch.outputs.latestBranch }}（${{ steps.getBranch.outputs.commitHash }}），请按需手动运行 Build OpenWrt。"

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 3
        keep_minimum_runs: 1
